name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: mvn -B verify

      - name: Run envcheck on itself
        run: java -jar target/envcheck.jar .

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: envcheck-jar
          path: target/envcheck.jar
